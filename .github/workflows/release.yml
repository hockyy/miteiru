name: Release

# Manual-only: run via `gh workflow run release.yml -f tag=vX.Y.Z` or the
# Actions tab. Intentionally not triggered by tag pushes to avoid CI spam.
# Optional: `-f platform=windows` (or macos / linux) to rebuild one OS.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and upload to (e.g. v7.4.5)'
        required: true
      platform:
        description: 'Which installers to build'
        type: choice
        required: true
        default: all
        options:
          - all
          - windows
          - macos
          - linux

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # Job-level `if` cannot read `matrix`, so pick the include list here.
  select:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.set.outputs.include }}
    steps:
      - id: set
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          python3 - <<'PY'
          import json, os
          jobs = [
            {"os": "windows-latest", "build": "npm run build:nsis", "extensions": "exe", "key": "windows"},
            {"os": "macos-latest", "build": "npm run build:macos", "extensions": "pkg", "key": "macos"},
            {"os": "ubuntu-22.04", "build": "npm run build:linux22", "extensions": "deb,AppImage", "key": "linux"},
            {"os": "ubuntu-24.04", "build": "npm run build:linux24", "extensions": "deb,AppImage", "key": "linux"},
          ]
          platform = os.environ["PLATFORM"]
          rows = jobs if platform == "all" else [j for j in jobs if j["key"] == platform]
          for row in rows:
              del row["key"]
          payload = json.dumps(rows)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("include<<EOF\n")
              fh.write(payload + "\n")
              fh.write("EOF\n")
          PY

  build:
    needs: select
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.include) }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Language asset payloads (dictionaries, tokenizers, SVGs) are gitignored;
      # fetch them from the `assets` release so installers bundle them.
      # GITHUB_TOKEN authenticates the release-list API call (unauthenticated
      # calls share a 60 req/hr pool per runner IP and often 403).
      - name: Download language assets
        run: npm run script:download-language-assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build artifacts
        run: ${{ matrix.build }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release if missing
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            exit 0
          fi
          notes="docs/whats-new/${tag#v}.md"
          if [ -f "$notes" ]; then
            gh release create "$tag" --repo "${{ github.repository }}" \
              --title "$tag" --notes-file "$notes"
          else
            gh release create "$tag" --repo "${{ github.repository }}" \
              --title "$tag" --generate-notes
          fi

      - name: Upload artifacts to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=()
          IFS=',' read -ra exts <<< "${{ matrix.extensions }}"
          for ext in "${exts[@]}"; do
            files+=(dist/*."${ext}")
          done
          if [ ${#files[@]} -eq 0 ]; then
            echo "No artifacts found in dist/"; ls -la dist/; exit 1
          fi
          gh release upload "${{ steps.meta.outputs.tag }}" "${files[@]}" \
            --repo "${{ github.repository }}" --clobber
          # Safety net: ensure the release ends up published + latest.
          gh release edit "${{ steps.meta.outputs.tag }}" \
            --repo "${{ github.repository }}" --draft=false --latest
