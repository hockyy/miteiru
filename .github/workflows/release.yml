name: Release

# Manual-only: run via `gh workflow run release.yml -f tag=vX.Y.Z` or the
# Actions tab. Intentionally not triggered by tag pushes to avoid CI spam.
# Optional: `-f platform=windows` (or macos / linux) to rebuild one OS.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and upload to (e.g. v8.0.0)'
        required: true
      platform:
        description: 'Which installers to build'
        type: choice
        required: true
        default: all
        options:
          - all
          - windows
          - macos
          - linux
      publish:
        description: 'Upload to the GitHub release (off: keep the installers as workflow artifacts only)'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

concurrency:
  # Per tag and platform, so rebuilding one OS doesn't cancel a run building the others.
  group: release-${{ inputs.tag }}-${{ inputs.platform }}
  cancel-in-progress: true

jobs:
  # Job-level `if` cannot read `matrix`, so pick the include list here.
  select:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.set.outputs.include }}
    steps:
      - id: set
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          python3 - <<'PY'
          import json, os
          bundle = "src-tauri/target/release/bundle"
          # The .sig files and the macOS .app.tar.gz are for in-app updates (latest.json, built by
          # the updater-manifest job); they exist only when the updater signing key is set.
          jobs = [
            {"os": "windows-latest", "key": "windows", "bundles": "nsis",
             "assets": f"{bundle}/nsis/*.exe {bundle}/nsis/*.exe.sig"},
            {"os": "macos-latest", "key": "macos", "bundles": "app,dmg",
             "assets": f"{bundle}/dmg/*.dmg {bundle}/macos/*.app.tar.gz {bundle}/macos/*.app.tar.gz.sig"},
            {"os": "ubuntu-22.04", "key": "linux", "bundles": "deb,appimage",
             "assets": f"{bundle}/deb/*.deb {bundle}/appimage/*.AppImage {bundle}/appimage/*.AppImage.sig"},
          ]
          platform = os.environ["PLATFORM"]
          rows = jobs if platform == "all" else [j for j in jobs if j["key"] == platform]
          for row in rows:
              del row["key"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("include<<EOF\n" + json.dumps(rows) + "\nEOF\n")
          PY

  # The language data, cut into one download per language (scripts/data/buildLanguagePacks.ts). Built
  # once here: the installers carry only the manifest (language-packs.json), and the apps fetch the
  # packs from this release the first time a language is used. The build jobs also install them from
  # these files in their smoke test.
  language-packs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The manifest's download address names the release after package.json's version.
      - name: Check the tag matches the version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "${{ inputs.tag }}" ]; then
            echo "::error::Tag ${{ inputs.tag }} is not v$version (package.json); the packs would be built to download from the wrong release."
            exit 1
          fi

      # Language asset payloads (dictionaries, tokenizers, SVGs) are gitignored; fetch them from the
      # `assets` release. GITHUB_TOKEN authenticates the release-list API call (unauthenticated
      # calls share a 60 req/hr pool per runner IP and often 403).
      - name: Download language assets
        run: npm run script:download-language-assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the language packs
        run: npm run build:language-packs

      - name: Keep the packs for the build jobs
        uses: actions/upload-artifact@v4
        with:
          name: language-packs
          path: dist/language-packs/
          if-no-files-found: error
          retention-days: 7

      - name: Create release if missing
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ inputs.tag }}"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            exit 0
          fi
          notes="docs/whats-new/${tag#v}.md"
          if [ -f "$notes" ]; then
            gh release create "$tag" --repo "${{ github.repository }}" --draft --target "${{ github.sha }}" \
              --title "$tag" --notes-file "$notes"
          else
            gh release create "$tag" --repo "${{ github.repository }}" --draft --target "${{ github.sha }}" \
              --title "$tag" --generate-notes
          fi

      - name: Upload the packs to the release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ inputs.tag }}" dist/language-packs/*.mtrpack \
            --repo "${{ github.repository }}" --clobber

  build:
    needs: [select, language-packs]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.include) }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf file \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav

      - name: Install dependencies
        run: npm ci

      # The installers carry only the packs' manifest; the packs themselves were built by the
      # language-packs job, and the smoke test below installs them.
      - name: Download the language packs
        uses: actions/download-artifact@v4
        with:
          name: language-packs
          path: dist/language-packs

      - name: Build the live captions helper
        if: runner.os != 'Linux'
        run: npm run build:live-captions

      # Stages the language packs' manifest, libmpv and the live captions helper
      # (scripts/stageTauriResources.mjs) and builds the installers. With the updater key (secrets
      # TAURI_SIGNING_PRIVATE_KEY and
      # TAURI_SIGNING_PRIVATE_KEY_PASSWORD, from `npx tauri signer generate`) it also signs the
      # update artifacts the app installs from latest.json.
      - name: Build installers
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MITEIRU_LANGUAGE_PACKS_DIR: ${{ github.workspace }}/dist/language-packs
        run: |
          updater=()
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            if [ -z "$(node -p "require('./src-tauri/tauri.conf.json').plugins.updater.pubkey")" ]; then
              echo "::error::The updater key is set, but plugins.updater.pubkey in src-tauri/tauri.conf.json is empty. Put the matching public key there."
              exit 1
            fi
            updater=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          else
            echo "::warning::No TAURI_SIGNING_PRIVATE_KEY secret: this release is built without update artifacts, so installed copies will not be offered it."
          fi
          npx tauri build --config src-tauri/tauri.release.conf.json "${updater[@]}" --bundles ${{ matrix.bundles }}

      # Tauri names the macOS update archive after the app only; give it the version and architecture.
      - name: Name the macOS update archive
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd src-tauri/target/release/bundle/macos
          version=$(node -p "require('../../../../../package.json').version")
          for file in Miteiru.app.tar.gz Miteiru.app.tar.gz.sig; do
            [ -e "$file" ] && mv "$file" "Miteiru_${version}_aarch64${file#Miteiru}"
          done
          ls

      # Windows: the installer as a user gets it, on the runner's fresh account. A silent install, the
      # installed app's smoke test (as below), then a silent uninstall, which must take the app with it.
      # The install goes over language data like the first 8.0.0 build's, which the installer's hook
      # (src-tauri/windows/installer-hooks.nsh) must clear: left there, it passes for bundled data.
      - name: Install, smoke-test and uninstall the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = Join-Path $env:LOCALAPPDATA 'Miteiru'
          $app = Join-Path $dir 'miteiru.exe'
          $stale = Join-Path $dir 'language-assets/japanese/dict'
          New-Item -ItemType Directory -Force -Path $stale | Out-Null
          Set-Content -Path (Join-Path $stale 'jmdict.json') -Value '{}'
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $install = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -PassThru -Wait
          "installer exit code: $($install.ExitCode)"
          if (-not (Test-Path $app)) { throw "the installer left no $app" }
          if (Test-Path (Join-Path $dir 'language-assets')) { throw 'the installer left the old language-assets folder' }
          $files = Get-ChildItem $dir -Recurse -File
          "installed: $($files.Count) files, $([math]::Round(($files | Measure-Object Length -Sum).Sum / 1MB, 1)) MiB in $dir"
          $server = Start-Process python -ArgumentList '-m', 'http.server', '--bind', '127.0.0.1', '8765', '--directory', 'dist/language-packs' -PassThru -WindowStyle Hidden
          $env:MITEIRU_USER_DATA_DIR = Join-Path $env:RUNNER_TEMP 'miteiru-profile'
          $env:MITEIRU_SMOKE_TEST = Join-Path $PWD 'smoke.json'
          $env:MITEIRU_SMOKE_LANGUAGE_PACKS = Join-Path $PWD 'dist/language-packs'
          $env:MITEIRU_LANGUAGE_PACK_URL = 'http://127.0.0.1:8765/'
          $env:MITEIRU_MUTED = '1'
          $smoke = Start-Process -FilePath $app -PassThru
          if (-not $smoke.WaitForExit(240000)) { Stop-Process -Id $smoke.Id -Force; throw 'the smoke test did not finish in 4 minutes' }
          Stop-Process -Id $server.Id -ErrorAction SilentlyContinue
          Get-Content smoke.json
          $results = Get-Content smoke.json -Raw | ConvertFrom-Json
          $failed = @($results.PSObject.Properties | Where-Object { $_.Name -ne 'running' -and -not $_.Value.ok } | ForEach-Object Name)
          # The NSIS uninstaller copies itself to %TEMP% and returns at once: wait for the app to go.
          Start-Process -FilePath (Join-Path $dir 'uninstall.exe') -ArgumentList '/S' -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path $app); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $app) { throw "the uninstaller left $app" }
          "uninstalled; left in ${dir}: $(@(Get-ChildItem $dir -Recurse -Force -ErrorAction SilentlyContinue).Count) items"
          if ($failed.Count -gt 0) { throw "smoke test failed: $($failed -join ', ')" }

      # The packaged app runs its smoke test (renderer/platform/smokeTest.ts) before anything is
      # uploaded: the signed .app on macOS, the AppImage on Linux (Windows above, from its installer). It
      # installs the language packs from the files in dist/language-packs, and Vietnamese through a
      # real download from a local server standing in for the release.
      - name: Smoke test the packaged app
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export MITEIRU_USER_DATA_DIR="$RUNNER_TEMP/miteiru-profile"
          export MITEIRU_SMOKE_LANGUAGE_PACKS="$PWD/dist/language-packs"
          export MITEIRU_LANGUAGE_PACK_URL="http://127.0.0.1:8765/"
          python3 -m http.server --bind 127.0.0.1 8765 --directory dist/language-packs &
          pack_server=$!
          if [ "$RUNNER_OS" = "macOS" ]; then
            # The app inside the DMG, as users get it (Tauri removes the loose .app after bundling).
            dmg=$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -1)
            volume=$(hdiutil attach -nobrowse -readonly "$dmg" | tail -1 | sed 's/.*\t//; s/[[:space:]]*$//')
            app=$(ls -d "$volume"/*.app/Contents/MacOS/* | head -1)
            bash scripts/runSmokeTest.sh "$app" "$PWD/smoke.json" "$PWD/smoke.png"
            hdiutil detach "$volume" || true
          else
            sudo apt-get install -y xvfb imagemagick libmpv1
            app=$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -1)
            chmod +x "$app"
            APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a -s "-screen 0 1280x800x24" \
              bash scripts/runSmokeTest.sh "$app" "$PWD/smoke.json" "$PWD/smoke.png"
          fi
          kill "$pack_server" || true
          cat smoke.json || echo "no smoke.json"
          node -e 'const r = require("./smoke.json"); const bad = Object.entries(r).filter(([, v]) => !v.ok); if (bad.length) { console.error("failed:", bad.map(([k]) => k).join(", ")); process.exit(1); }'

      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-smoke-${{ matrix.os }}
          path: |
            smoke.json
            smoke*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Keep installers as artifacts
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/*/*.sig
            src-tauri/target/release/bundle/macos/*.app.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Resolve tag
        if: ${{ inputs.publish }}
        id: meta
        shell: bash
        run: echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Create release if missing
        if: ${{ inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            exit 0
          fi
          notes="docs/whats-new/${tag#v}.md"
          if [ -f "$notes" ]; then
            gh release create "$tag" --repo "${{ github.repository }}" --draft --target "${{ github.sha }}" \
              --title "$tag" --notes-file "$notes"
          else
            gh release create "$tag" --repo "${{ github.repository }}" --draft --target "${{ github.sha }}" \
              --title "$tag" --generate-notes
          fi

      - name: Upload artifacts to release
        if: ${{ inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(${{ matrix.assets }})
          if [ ${#files[@]} -eq 0 ]; then
            echo "No installers found"; ls -R src-tauri/target/release/bundle || true; exit 1
          fi
          gh release upload "${{ steps.meta.outputs.tag }}" "${files[@]}" \
            --repo "${{ github.repository }}" --clobber
          # A new release stays a draft until every platform's installer is on it, so nobody finds it
          # without theirs. The build job that uploads last publishes it and marks it latest.
          names=$(gh release view "${{ steps.meta.outputs.tag }}" --repo "${{ github.repository }}" --json assets -q '.assets[].name')
          if grep -q -- '-setup\.exe$' <<<"$names" && grep -q '\.dmg$' <<<"$names" && grep -q '\.AppImage$' <<<"$names"; then
            gh release edit "${{ steps.meta.outputs.tag }}" \
              --repo "${{ github.repository }}" --draft=false --latest
          else
            echo "Not every platform's installer is on ${{ steps.meta.outputs.tag }} yet: left as it is."
          fi

  # latest.json, which installed copies read to find this release (plugins.updater.endpoints in
  # src-tauri/tauri.conf.json). Built from the .sig files the build jobs uploaded; a rebuild of one
  # platform keeps the others. Nothing is written when the release has no signed update artifacts.
  updater-manifest:
    needs: build
    if: ${{ !cancelled() && inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Publish latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/makeUpdaterManifest.mjs "${{ inputs.tag }}"
