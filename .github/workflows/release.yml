name: Release

# Manual-only: run via `gh workflow run release.yml -f tag=vX.Y.Z` or the
# Actions tab. Intentionally not triggered by tag pushes to avoid CI spam.
# Optional: `-f platform=windows` (or macos / linux) to rebuild one OS.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and upload to (e.g. v8.0.0)'
        required: true
      platform:
        description: 'Which installers to build'
        type: choice
        required: true
        default: all
        options:
          - all
          - windows
          - macos
          - linux
      publish:
        description: 'Upload to the GitHub release (off: keep the installers as workflow artifacts only)'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # Job-level `if` cannot read `matrix`, so pick the include list here.
  select:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.set.outputs.include }}
    steps:
      - id: set
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          python3 - <<'PY'
          import json, os
          bundle = "src-tauri/target/release/bundle"
          jobs = [
            {"os": "windows-latest", "key": "windows", "bundles": "nsis", "assets": f"{bundle}/nsis/*.exe"},
            {"os": "macos-latest", "key": "macos", "bundles": "dmg", "assets": f"{bundle}/dmg/*.dmg"},
            {"os": "ubuntu-22.04", "key": "linux", "bundles": "deb,appimage",
             "assets": f"{bundle}/deb/*.deb {bundle}/appimage/*.AppImage"},
          ]
          platform = os.environ["PLATFORM"]
          rows = jobs if platform == "all" else [j for j in jobs if j["key"] == platform]
          for row in rows:
              del row["key"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("include<<EOF\n" + json.dumps(rows) + "\nEOF\n")
          PY

  build:
    needs: select
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.include) }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf file

      - name: Install dependencies
        run: npm ci

      # Language asset payloads (dictionaries, tokenizers, SVGs) are gitignored;
      # fetch them from the `assets` release so installers bundle them.
      # GITHUB_TOKEN authenticates the release-list API call (unauthenticated
      # calls share a 60 req/hr pool per runner IP and often 403).
      - name: Download language assets
        run: npm run script:download-language-assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the live captions helper
        if: runner.os != 'Linux'
        run: npm run build:live-captions

      # Stages language assets, libmpv and the live captions helper (scripts/stageTauriResources.mjs)
      # and builds the installers.
      - name: Build installers
        run: npx tauri build --config src-tauri/tauri.release.conf.json --bundles ${{ matrix.bundles }}

      - name: Keep installers as artifacts
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7

      - name: Resolve tag
        if: ${{ inputs.publish }}
        id: meta
        shell: bash
        run: echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Create release if missing
        if: ${{ inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            exit 0
          fi
          notes="docs/whats-new/${tag#v}.md"
          if [ -f "$notes" ]; then
            gh release create "$tag" --repo "${{ github.repository }}" \
              --title "$tag" --notes-file "$notes"
          else
            gh release create "$tag" --repo "${{ github.repository }}" \
              --title "$tag" --generate-notes
          fi

      - name: Upload artifacts to release
        if: ${{ inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(${{ matrix.assets }})
          if [ ${#files[@]} -eq 0 ]; then
            echo "No installers found"; ls -R src-tauri/target/release/bundle || true; exit 1
          fi
          gh release upload "${{ steps.meta.outputs.tag }}" "${files[@]}" \
            --repo "${{ github.repository }}" --clobber
          # Safety net: ensure the release ends up published + latest.
          gh release edit "${{ steps.meta.outputs.tag }}" \
            --repo "${{ github.repository }}" --draft=false --latest
