name: Desktop build check

# Manual only, like CI and Release: builds the Tauri desktop app on each OS without packaging
# a release, so platform code can be checked on macOS and Linux from a Windows machine.
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Comma-separated: windows, macos, linux"
        required: false
        default: "macos,linux"

permissions:
  contents: read

jobs:
  pick:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          all='[{"key":"windows","os":"windows-latest"},{"key":"macos","os":"macos-latest"},{"key":"linux","os":"ubuntu-22.04"}]'
          want="${{ github.event.inputs.platforms }}"
          echo "matrix=$(echo "$all" | jq -c --arg w "$want" '[.[] | select(.key as $k | ($w | split(",") | map(gsub(" ";"")) | index($k)))]')" >> "$GITHUB_OUTPUT"

  build:
    needs: pick
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.pick.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux packages
        if: matrix.key == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf libmpv-dev xvfb
      - run: npm ci
      - name: Build renderer
        run: npm run build:renderer
      - name: Build desktop app (debug, no bundle)
        working-directory: src-tauri
        run: cargo build
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: miteiru-${{ matrix.key }}
          path: |
            src-tauri/target/debug/miteiru
            src-tauri/target/debug/miteiru.exe
          if-no-files-found: warn
          retention-days: 3
