name: Desktop build check

# Manual only, like CI and Release: builds the Tauri desktop app on each OS without packaging a
# release, then runs its smoke test (renderer/platform/smokeTest.ts): the backend worker, the store,
# the analyzer API, libmpv drawing under the page and a YouTube embed. The results and a screenshot
# are uploaded, so platform code can be checked on macOS and Linux from a Windows machine.
# With release_tag set, it also downloads that published release's Vietnamese pack through the app's
# own downloader on each OS (see the step for why each OS needs its own run), and with linux among
# the platforms, installs the release's .deb on Ubuntu 22.04, Ubuntu 24.04 and Debian 12 (the deb job).
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Comma-separated: windows, macos, linux"
        required: false
        default: "macos,linux"
      release_tag:
        description: "Optional: a published release (e.g. v8.0.1) to download a language pack from on each OS"
        required: false
        default: ""
      wayland:
        description: "Linux: also run the smoke test under a headless Wayland compositor (weston), with no X server"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  pick:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          all='[{"key":"windows","os":"windows-latest"},{"key":"macos","os":"macos-latest"},{"key":"linux","os":"ubuntu-22.04"}]'
          want="${{ github.event.inputs.platforms }}"
          echo "matrix=$(echo "$all" | jq -c --arg w "$want" '[.[] | select(.key as $k | ($w | split(",") | map(gsub(" ";"")) | index($k)))]')" >> "$GITHUB_OUTPUT"

  build:
    needs: pick
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.pick.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux packages
        if: matrix.key == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            patchelf libmpv-dev xvfb imagemagick gdb \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
      - run: npm ci
      - name: Fetch libmpv
        if: matrix.key != 'linux'
        run: node scripts/fetchLibmpv.mjs --if-needed
      - name: Build renderer
        run: npm run build:renderer
      - name: Build desktop app (debug, frontend embedded)
        working-directory: src-tauri
        run: cargo build --features tauri/custom-protocol

      # The app's language downloader (src-tauri/src/sys/langpack.rs) checks certificates with each
      # OS's own trust store (rustls-platform-verifier): Security.framework on macOS, the system CA
      # bundle on Linux, the Windows store on Windows. So a download that works on one OS proves nothing
      # for the others. This fetches the release's Vietnamese pack the way an install does (GitHub's
      # redirect, progress, then size and sha256) and checks it against GitHub's own sha256 for the file.
      - name: Download a language pack from the release
        if: github.event.inputs.release_tag != ''
        working-directory: src-tauri
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag }}
        run: |
          file=Miteiru-language-vietnamese.mtrpack
          asset=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq ".assets[] | select(.name == \"$file\")")
          if [ -z "$asset" ]; then echo "$TAG has no $file"; exit 1; fi
          export MITEIRU_REAL_DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/$TAG/$file"
          export MITEIRU_REAL_DOWNLOAD_BYTES=$(jq -r .size <<<"$asset")
          export MITEIRU_REAL_DOWNLOAD_SHA256=$(jq -r '.digest | sub("^sha256:"; "")' <<<"$asset")
          cargo test --lib langpack::tests::downloads_a_real_release_asset -- --ignored --nocapture

      - name: Smoke test
        if: matrix.key != 'windows'
        shell: bash
        run: |
          export MITEIRU_USER_DATA_DIR="$RUNNER_TEMP/miteiru-profile"
          run=(bash scripts/runSmokeTest.sh src-tauri/target/debug/miteiru "$PWD/smoke.json" "$PWD/smoke.png")
          if [ "$RUNNER_OS" = "Linux" ]; then
            MITEIRU_SMOKE_GDB=1 xvfb-run -a -s "-screen 0 1280x800x24" "${run[@]}"
          else
            "${run[@]}"
          fi
          cat smoke.json || echo "no smoke.json"
          node -e 'const r = require("./smoke.json"); const bad = Object.entries(r).filter(([, v]) => !v.ok); if (bad.length) { console.error("failed:", bad.map(([k]) => k).join(", ")); process.exit(1); }'

      # Most Linux desktops are Wayland sessions now. The smoke test above runs on X11 (Xvfb), where
      # GTK's GL area gets a GLX context; under Wayland it gets an EGL one, which video_gl.rs handles
      # separately. Here the app runs on a headless weston with no X server at all, with software GL.
      - name: Smoke test under Wayland
        if: matrix.key == 'linux' && github.event.inputs.wayland == 'true'
        shell: bash
        run: |
          sudo apt-get install -y weston
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"
          mkdir -p -m 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --socket=wayland-smoke --width=1280 --height=800 --idle-time=0 > "$RUNNER_TEMP/weston.log" 2>&1 &
          weston_pid=$!
          for _ in $(seq 1 50); do [ -S "$XDG_RUNTIME_DIR/wayland-smoke" ] && break; sleep 0.2; done
          if [ ! -S "$XDG_RUNTIME_DIR/wayland-smoke" ]; then cat "$RUNNER_TEMP/weston.log"; exit 1; fi
          unset DISPLAY
          export WAYLAND_DISPLAY=wayland-smoke GDK_BACKEND=wayland LIBGL_ALWAYS_SOFTWARE=1
          export MITEIRU_USER_DATA_DIR="$RUNNER_TEMP/miteiru-profile-wayland"
          MITEIRU_SMOKE_GDB=1 bash scripts/runSmokeTest.sh src-tauri/target/debug/miteiru "$PWD/smoke-wayland.json" "$PWD/smoke-wayland.png"
          kill "$weston_pid" 2>/dev/null || true
          echo "--- weston log (tail)"; tail -n 20 "$RUNNER_TEMP/weston.log" || true
          cat smoke-wayland.json || echo "no smoke-wayland.json"
          node -e 'const r = require("./smoke-wayland.json"); const bad = Object.entries(r).filter(([, v]) => !v.ok); if (bad.length) { console.error("failed under Wayland:", bad.map(([k]) => k).join(", ")); process.exit(1); }'

      - name: Upload smoke test results
        if: always() && matrix.key != 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.key }}
          path: |
            smoke*.json
            smoke*.png
          if-no-files-found: warn
          retention-days: 7

  # The published .deb on the distros it is meant for (#116): it installs with what it depends on
  # (libmpv, WebKitGTK, GStreamer through Recommends), nothing it links is missing, and the app's
  # self-test passes under Xvfb with the release's language packs. Runs with release_tag and linux.
  deb:
    if: github.event.inputs.release_tag != '' && contains(github.event.inputs.platforms, 'linux')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "ubuntu:24.04", "debian:12"]
    steps:
      - name: Download the release's .deb and language packs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir deb
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.mtrpack' --dir packs
          ls -l deb packs
      - name: Install it and run the self-test in ${{ matrix.image }}
        run: |
          mkdir -p out
          docker run --rm -v "$PWD/deb:/deb:ro" -v "$PWD/packs:/packs:ro" -v "$PWD/out:/out" "${{ matrix.image }}" bash -euo pipefail -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            if ! apt-get install -y -qq /deb/*.deb xvfb xauth libgl1-mesa-dri > /out/apt.log 2>&1; then tail -n 60 /out/apt.log; exit 1; fi
            pkg=$(dpkg-deb -f /deb/*.deb Package)
            dpkg -s "$pkg" | grep -E "^(Package|Version|Depends|Recommends):"
            bin=$(dpkg -L "$pkg" | grep -E "^/usr/bin/" | head -n 1)
            echo "binary: $bin"
            if ldd "$bin" | grep "not found"; then echo "missing libraries"; exit 1; fi
            ldconfig -p | grep -E "libmpv[.]so[.][12]" || { echo "no libmpv from the distribution"; exit 1; }
            export MITEIRU_USER_DATA_DIR=/tmp/miteiru-profile MITEIRU_SMOKE_TEST=/out/smoke.json MITEIRU_SMOKE_LANGUAGE_PACKS=/packs MITEIRU_MUTED=1
            code=0
            timeout 300 xvfb-run -a -s "-screen 0 1280x800x24" "$bin" > /out/app.log 2>&1 || code=$?
            echo "app exit code: $code"
            if [ ! -s /out/smoke.json ]; then tail -n 60 /out/app.log; exit 1; fi
            cat /out/smoke.json
            if grep -q "\"ok\": false" /out/smoke.json; then echo "a self-test step failed"; exit 1; fi
          '
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ strategy.job-index }}
          path: out/
          if-no-files-found: warn
          retention-days: 7
