name: CI

# Manual only, like Release: start it from the Actions tab or with `gh workflow run CI`.
# The same checks (npm run lint:smells, npm test, typecheck) run locally before merging.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:smells
      - run: npm test
      - run: npx tsc -p renderer --noEmit
      - run: node scripts/buildBackendWorker.mjs
