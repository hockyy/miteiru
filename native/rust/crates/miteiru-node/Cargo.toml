[package]
name = "miteiru-node"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Node-API addon for Miteiru's headless language server (main/headless): the desktop app's own tokenizers and data tables (miteiru-langdata), callable from Node"

[lib]
crate-type = ["cdylib"]

[dependencies]
miteiru-jyutping = { path = "../miteiru-jyutping" }
miteiru-langdata = { path = "../miteiru-langdata" }
napi = { version = "3", default-features = false, features = ["napi6"] }
napi-derive = "3"
serde_json = "1"

[build-dependencies]
napi-build = "2"
