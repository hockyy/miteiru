[package]
name = "miteiru-tokenizer"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Miteiru's own tokenizers: Japanese (kuromoji-compatible lattice over IPADIC) and Chinese (frequency-scored word lattice), both taking app and user words"

[dependencies]
cedarwood = "0.4"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"

[dev-dependencies]
jieba-rs = { version = "=0.8.1", default-features = false }
