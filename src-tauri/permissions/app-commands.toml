# Every command Miteiru's frontend and backend worker call (build.rs lists them).
[[set]]
identifier = "app-commands"
description = "The commands Miteiru's frontend and backend worker call."
permissions = [
  "allow-sys-info",
  "allow-drop-paths-take",
  "allow-smoke-test-exit",
  "allow-fs-read-text",
  "allow-fs-read-bytes",
  "allow-fs-read-range",
  "allow-fs-read-asset",
  "allow-zstd-decompress",
  "allow-table-open",
  "allow-table-close",
  "allow-table-get-many",
  "allow-table-values",
  "allow-fs-write-text",
  "allow-fs-write-bytes",
  "allow-fs-stat",
  "allow-fs-mkdir",
  "allow-fs-readdir",
  "allow-fs-rm",
  "allow-fs-rename",
  "allow-fs-copy",
  "allow-fs-mkdtemp",
  "allow-proc-spawn",
  "allow-proc-write",
  "allow-proc-end",
  "allow-proc-kill",
  "allow-proc-which",
  "allow-kv-open",
  "allow-kv-get",
  "allow-kv-get-many",
  "allow-kv-put",
  "allow-kv-del",
  "allow-kv-batch",
  "allow-kv-bulk",
  "allow-kv-import-dictionary",
  "allow-kv-range",
  "allow-kv-clear",
  "allow-kv-close",
  "allow-jieba-load",
  "allow-jieba-cut",
  "allow-http-request",
  "allow-shell-open-external",
  "allow-shell-open-path",
  "allow-shell-show-item",
  "allow-dialog-open",
  "allow-dialog-save",
  "allow-player-open",
  "allow-player-command",
  "allow-player-set",
  "allow-player-get",
  "allow-player-observe",
  "allow-player-set-rect",
  "allow-player-close",
  "allow-analyzer-start",
  "allow-analyzer-respond",
  "allow-mkv-tracks",
  "allow-mkv-extract-subtitle",
  "allow-langpack-status",
  "allow-langpack-install",
  "allow-langpack-install-file",
  "allow-langpack-cancel",
  "allow-langpack-remove",
]
