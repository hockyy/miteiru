[package]
name = "miteiru"
version = "0.0.0"
description = "Miteiru desktop app (Tauri shell; the app version comes from package.json)"
authors = ["Hocky Yudhiono"]
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "miteiru_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Gzipped language assets, read by the dictionary import (sys/dict_import.rs).
flate2 = "1"
# Data table blocks (sys/zstd.rs; docs/DATA_FORMAT.md).
zstd = "0.13"
# Language pack downloads are checked against the manifest's sha256 (sys/langpack.rs).
sha2 = "0.10"
log = "0.4"
tauri-plugin-log = "2"
base64 = "0.22"
dirs = "6"
rusqlite = { version = "0.37", features = ["bundled"] }
rusty-leveldb = "3"
jieba-rs = { version = "0.8", default-features = false }
tiny_http = "0.12"
raw-window-handle = "0.6"
miteiru-mpv = { path = "../native/rust/crates/miteiru-mpv" }
miteiru-tokenizer = { path = "../native/rust/crates/miteiru-tokenizer" }

# In-app updates (src-tauri/src/updates.rs). Desktop only; held to the 2.12 / 2.3 lines that
# match tauri 2.12 (newer ones ask for a newer tauri).
[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-updater = "~2.12"
tauri-plugin-process = "~2.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
# The same versions wry uses (file_drop_windows.rs talks to its WebView2).
webview2-com = "0.39"
windows-core = "0.62"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
libloading = "0.9"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
