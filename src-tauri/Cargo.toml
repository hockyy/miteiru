[package]
name = "miteiru"
version = "0.0.0"
description = "Miteiru desktop app (Tauri shell; the app version comes from package.json)"
authors = ["Hocky Yudhiono"]
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "miteiru_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tauri-plugin-log = "2"
base64 = "0.22"
dirs = "6"
rusqlite = { version = "0.37", features = ["bundled"] }
rusty-leveldb = "3"
jieba-rs = "0.8"
tiny_http = "0.12"
raw-window-handle = "0.6"
miteiru-mpv = { path = "../native/rust/crates/miteiru-mpv" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
libloading = "0.9"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
