appId: id.hocky.miteiru
productName: Miteiru
copyright: Copyright © 2022-2023 Hocky Yudhiono
directories:
  output: dist
  buildResources: resources
files:
  - from: .
    filter:
      - package.json
      - app
win:
  extraResources:
    - from: resources/live-captions
      to: live-captions
      filter:
        - "**/*"
        - "!**/.gitkeep"
mac:
  extraResources:
    - from: resources/live-captions
      to: live-captions
      filter:
        - "**/*"
        - "!**/.gitkeep"
  extendInfo:
    NSAudioCaptureUsageDescription: Miteiru uses computer audio to show live captions.
    NSMicrophoneUsageDescription: Miteiru uses the microphone to show live captions.
    NSScreenCaptureUsageDescription: Miteiru reads computer audio for live captions.
publish: null
